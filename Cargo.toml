[workspace]
resolver = "3"
members = ["crates/fernq"]
exclude = ["bench", "fuzz"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.test]
opt-level = 1
